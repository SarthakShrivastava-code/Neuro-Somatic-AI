name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 2 days at midnight UTC to reset Streamlit's 7-day timer
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Allows you to manually trigger it anytime from GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Visit App with Headless Browser
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import time

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              print('Visiting app...')
              page.goto('https://neuro-somatic-ai-jk4evklermj6mycc5xtdyw.streamlit.app')
              
              time.sleep(10)
              wake_button = page.query_selector('button:has-text(\"Yes, get this app back up!\")')
              if wake_button:
                  print('App was sleeping, clicking Wake Up button...')
                  wake_button.click()
                  time.sleep(15)
              print('Successfully kept app alive.')
              browser.close()
          "
